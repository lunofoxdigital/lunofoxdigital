<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunoFox Digital</title>
    <meta name="description" content="LunoFox Digital - Digital Content, Web Design & Media Production">
    <style>
        :root {
            --bg-dark: #090c10;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-orange: #ff6b35;
            --accent-purple: #7928ca;
            --glass-bg: rgba(22, 27, 34, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-hover: rgba(255, 255, 255, 0.12);
            --btn-bg: rgba(255, 255, 255, 0.06);
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: var(--font-stack);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: float 18s ease-in-out infinite alternate;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, var(--accent-orange) 0%, rgba(255,107,53,0) 70%);
            animation-duration: 22s;
        }

        .orb-2 {
            bottom: -15%;
            right: -10%;
            width: 70vw;
            height: 70vw;
            max-width: 700px;
            max-height: 700px;
            background: radial-gradient(circle, var(--accent-purple) 0%, rgba(121,40,202,0) 70%);
            animation-duration: 26s;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(5%, 8%) scale(1.08);
            }
            100% {
                transform: translate(-5%, -5%) scale(0.95);
            }
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1.25rem;
        }

        .card {
            width: 100%;
            max-width: 540px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 3rem 2.25rem;
            box-shadow: var(--shadow);
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem auto;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255,107,53,0.2) 0%, rgba(121,40,202,0.2) 100%);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .logo-badge svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-orange);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .dot-divider {
            color: var(--accent-orange);
            margin: 0 0.35rem;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem 1.25rem;
            min-height: 54px;
            background: var(--btn-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }

        .btn:hover, .btn:focus-visible {
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            outline: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .btn-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.25s ease;
        }

        .btn:hover .btn-icon svg {
            transform: scale(1.1);
        }

        .btn-text {
            flex-grow: 1;
            text-align: left;
        }

        .btn-arrow {
            opacity: 0.4;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .btn:hover .btn-arrow {
            opacity: 1;
            transform: translateX(4px);
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Responsive spacing adjustments */
        @media (max-width: 480px) {
            .card {
                padding: 2.25rem 1.5rem;
                border-radius: 22px;
            }
            
            .subtitle {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
